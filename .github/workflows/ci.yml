name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SistemaConvenios.sln
      - run: dotnet build SistemaConvenios.sln --configuration Release --no-restore
      - run: dotnet test SistemaConvenios.sln --configuration Release --no-build --no-restore
      - run: dotnet tool install --global dotnet-ef --version 10.0.9
      - run: dotnet ef migrations has-pending-model-changes --project SistemaConvenios.csproj --startup-project SistemaConvenios.csproj --context ApplicationDbContext --no-build --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: Host=localhost;Database=convenios_ci;Username=postgres;Password=unused
      - run: docker build --tag sistema-convenios:ci .
