services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-convenios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: convenios_fcvt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
    ports:
      - "5433:5432"
    volumes:
      - sistema-convenios-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convenios_fcvt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sistema-convenios-pgdata:
    name: sistema-convenios-pgdata
