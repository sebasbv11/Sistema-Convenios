services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: convenios_fcvt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convenios_fcvt"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=convenios_fcvt;Username=postgres;Password=${POSTGRES_PASSWORD}"
      SeedAdmin__Enabled: "false"
      Database__ApplyMigrationsOnStartup: "false"
      DataProtection__KeysPath: /app/data/keys
      DataProtection__Provider: FileSystem
      ArchivosConfig__Provider: Local
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/Storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  app-data:
